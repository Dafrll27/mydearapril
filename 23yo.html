<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>When Humans Lose Everything, What Is Still Left?</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f6fb;
  --text:#2e2e2e;
  --sub:#6b6b7a;
  --accent:#9aa6ff;
  --line:#e4e7f2;
  --highlight:#fff3c4;
}

/* Dark mode variables */
body.dark{
  --bg:#0f1117;
  --text:#e8e8f0;
  --sub:#a0a0b5;
  --line:#222633;
  --highlight:rgba(154,166,255,0.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Comic Neue','Comic Sans MS',cursive;
  background:var(--bg);
  color:var(--text);
  line-height:1.9;
  transition:background .3s ease, color .3s ease;
}

/* Progress bar */
#progress{
  position:fixed;
  top:0;
  left:0;
  height:4px;
  width:0%;
  background:linear-gradient(90deg,#9aa6ff,#bfa8ff);
  z-index:9999;
}

/* Dark mode button */
.mode-btn{
  position:fixed;
  top:18px;
  right:18px;
  z-index:999;
  padding:8px 12px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  background:#ffffff;
  font-size:14px;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

body.dark .mode-btn{
  background:#1e2230;
  color:#fff;
}

/* Layout */
.container{
  max-width:850px;
  margin:auto;
  padding:90px 22px;
}

/* Header */
.blog-header{
  text-align:center;
  margin-bottom:60px;
}

.blog-header h1{
  font-size:2.4rem;
  margin-bottom:12px;
}

.meta{
  font-size:0.9rem;
  color:var(--sub);
}

/* Section */
.section{
  margin-bottom:45px;
  animation:fadeUp 0.8s ease both;
}

.section h2{
  font-size:1.5rem;
  margin-bottom:14px;
  border-left:4px solid var(--accent);
  padding-left:14px;
}

.section h3{
  font-size:1.2rem;
  margin-top:20px;
  margin-bottom:10px;
}

.section p{
  margin-bottom:16px;
}

/* Highlight important line */
.key-line{
  background:linear-gradient(transparent 70%, var(--highlight) 70%);
  padding:2px 4px;
}

/* Quote block */
.quote{
  font-style:italic;
  margin:20px 0;
  padding-left:16px;
  border-left:3px solid var(--accent);
}

/* Divider */
.divider{
  height:1px;
  background:var(--line);
  margin:60px 0;
}

/* Footer */
.footer{
  margin-top:80px;
  text-align:center;
  font-size:0.85rem;
  color:var(--sub);
}

/* Animation */
@keyframes fadeUp{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

/* Mobile */
@media(max-width:600px){
  .blog-header h1{
    font-size:1.9rem;
  }
}
</style>
</head>

<body>

<div id="progress"></div>
<button class="mode-btn" id="darkToggle">🌙</button>

<div class="container">

<header class="blog-header">
  <h1>When Humans Lose Everything, What Is Still Left?</h1>
  <div class="meta">Published on 15 May 2026</div>
</header>

<section class="section">

</section>

<footer class="footer">
© 2025 Dear April • All rights reserved
</footer>

</div>

<script>
/* Progress bar */
window.addEventListener('scroll',()=>{
  const scrollTop=document.documentElement.scrollTop;
  const height=document.documentElement.scrollHeight-document.documentElement.clientHeight;
  const progress=(scrollTop/height)*100;
  document.getElementById('progress').style.width=progress+'%';
});

/* Dark mode toggle */
const toggle=document.getElementById('darkToggle');
toggle.onclick=function(){
  document.body.classList.toggle('dark');
  localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
};

/* Persist theme */
if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark");
}
</script>

</body>
</html>
